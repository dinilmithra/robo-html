[project]
name = "robo-html"
version = "0.1.9"
description = "Reusable HTML report rendering utilities for automation projects"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.poetry]
packages = [{ include = "robo_html" }]
exclude = ["tools/**"]

[tool.poetry.group.dev.dependencies]
black = "26.5.1"

[tool.black]
line-length = 88
target-version = ["py312"]

[build-system]
requires = ["poetry-core==2.5.0"]
build-backend = "poetry.core.masonry.api"
